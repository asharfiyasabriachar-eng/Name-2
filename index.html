<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS13GAMEINGERAN - Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 400px;
            padding: 20px;
            background: #222;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffd700;
        }
        h2 {
            margin-bottom: 10px;
            color: #ffd700;
        }
        p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            color: #111;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #ffc700;
        }
        #gameScreen {
            display: none;
        }
    </style>
</head>
<body>

    <!-- नाम दर्ज करने वाला पेज (सिर्फ नए यूजर के लिए) -->
    <div class="container" id="welcomeScreen">
        <!-- यहाँ अपने लोगो का लिंक या पाथ डालें -->
        <img src="https://via.placeholder.com/100" alt="App Logo" class="logo" id="appLogo">
        <h2>MS13GAMEINGERAN</h2>
        <p>कृपया आगे बढ़ने के लिए अपना नाम दर्ज करें:</p>
        <input type="text5" id="usernameInput" placeholder="अपना नाम यहाँ लिखें...">
        <button onclick="saveName()">शुरू करें</button>
    </div>

    <!-- गेम या मुख्य होम स्क्रीन (पुराने/सेव्ड यूजर के लिए) -->
    <div class="container" id="gameScreen">
        <h1 id="greeting"></h1>
        <p>आपका गेम लोड हो रहा है...</p>
        <button onclick="resetData()" style="background: #ff4444; color: #fff; margin-top: 20px;">नाम बदलें / रीसेट करें</button>
    </div>

    <script>
        // पेज लोड होते ही चेक करें कि क्या नाम पहले से सेव है
        window.onload = function() {
            const savedName = localStorage.getItem("ms13_username");
            if (savedName) {
                // अगर नाम पहले से है, तो सीधे गेम स्क्रीन दिखाओ
                showGame(savedName);
            }
        };

        function saveName() {
            const nameInput = document.getElementById("usernameInput").value.trim();
            if (nameInput === "") {
                alert("कृपया अपना नाम दर्ज करें!");
                return;
            }
            // localStorage में हमेशा के लिए नाम सेव करें
            localStorage.setItem("ms13_username", nameInput);
            showGame(nameInput);
        }

        function showGame(username) {
            document.getElementById("welcomeScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            document.getElementById("greeting").innerText = "स्वागत है, " + username + "!";
        }

        // अगर कोई यूजर अपना नाम दोबारा बदलना चाहे
        function resetData() {
            localStorage.removeItem("ms13_username");
            location.reload();
        }
    </script>
</body>
</html>
