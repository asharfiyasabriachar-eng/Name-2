<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS13GAMEINGERAN</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* लोडिंग स्क्रीन स्टाइल */
        #loadingScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s ease;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* मेन कार्ड बॉक्स स्टाइल */
        .container {
            width: 90%;
            max-width: 380px;
            padding: 30px 20px;
            background: rgba(30, 58, 138, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: none;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 15px;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid #60a5fa;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
        }

        h2 {
            margin: 10px 0 5px 0;
            color: #60a5fa;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #3b82f6;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- प्रोफेशनल लोडिंग स्क्रीन -->
    <div id="loadingScreen">
        <img src="" alt="MS13 Logo" class="logo app-logo">
        <h2 style="color: #60a5fa; margin-top: 10px;">MS13GAMEINGERAN</h2>
        <div class="spinner"></div>
    </div>

    <!-- नए यूजर के लिए नाम दर्ज करने वाला पेज -->
    <div class="container" id="welcomeScreen">
        <img src="" alt="MS13 Logo" class="logo app-logo">
        <h2>स्वागत है!</h2>
        <p>जारी रखने के लिए कृपया अपना नाम दर्ज करें:</p>
        <input type="text" id="usernameInput" placeholder="अपना नाम यहाँ लिखें...">
        <button onclick="saveName()">शुरू करें</button>
    </div>

    <script>
        // आपकी इमेज का डायरेक्ट लिंक
        const myGameImage = "https://i.ibb.co/5zJjKtB/image.png";

        // सभी लोगो पर इमेज सेट करना
        const logoElements = document.querySelectorAll('.app-logo');
        logoElements.forEach(img => {
            img.src = myGameImage;
        });

        window.onload = function() {
            // चेक करें कि क्या नाम पहले से सेव है
            const savedName = localStorage.getItem("ms13_username");
            
            setTimeout(function() {
                document.getElementById("loadingScreen").style.opacity = "0";
                setTimeout(function() {
                    document.getElementById("loadingScreen").style.display = "none";
                    
                    if (savedName) {
                        // अगर नाम पहले से है, तो सीधे Thunkable को सिग्नल भेजकर अगली स्क्रीन पर भेज दो
                        sendDataToThunkable(savedName);
                    } else {
                        // अगर नया यूजर है, तो नाम वाला बॉक्स दिखाओ
                        document.getElementById("welcomeScreen").style.display = "block";
                    }
                }, 500);
            }, 2500); // 2.5 सेकंड का प्रोफेशनल लोडिंग टाइम
        };

        function saveName() {
            const nameInput = document.getElementById("usernameInput").value.trim();
            if (nameInput === "") {
                alert("कृपया पहले अपना नाम दर्ज करें!");
                return;
            }
            // हमेशा के लिए नाम सेव करें
            localStorage.setItem("ms13_username", nameInput);
            
            // Thunkable को नाम भेजें और आगे बढ़ाएं
            sendDataToThunkable(nameInput);
        }

        function sendDataToThunkable(username) {
            // Thunkable के Web Viewer को मैसेज भेजना
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(username);
            } else {
                console.log("Name Saved: " + username);
            }
        }
    </script>
</body>
</html>
