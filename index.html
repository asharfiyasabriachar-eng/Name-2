<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Home Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #333333;
            border-top: 6px solid #f1c40f;
            position: relative;
            z-index: 10;
        }
        h2 {
            margin-bottom: 10px;
            color: #d4ac0d;
            font-size: 26px;
        }
        p {
            margin-bottom: 25px;
            color: #666666;
            font-size: 14px;
        }
        .input-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }
        .input-box:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 5px rgba(241, 196, 15, 0.4);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border: none;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome!</h2>
        <p>Please enter your name to start the game</p>
        
        <input type="text" id="playerName" class="input-box" placeholder="Type your name here...">
        <div id="errorMsg" class="error-msg">Please enter your name before proceeding!</div>
        
        <button type="button" id="nextBtn" class="btn">Next</button>
    </div>

    <script>
        document.getElementById("nextBtn").addEventListener("click", function() {
            var nameInput = document.getElementById("playerName").value.trim();
            var errorMsg = document.getElementById("errorMsg");

            if (nameInput === "") {
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.style.display = "none";
            localStorage.setItem("savedPlayerName", nameInput);

                    try {
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(nameInput);
            } else {
                window.parent.postMessage(nameInput, "*");
            }
        } catch (error) {
            console.log("Error: ", error);
        }

        });
    </script>

</body>
</html>
